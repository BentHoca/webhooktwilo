<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Motion gancho</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F4F6FA}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:#0B1220}
#bg{position:absolute;inset:0}
#dots{position:absolute;inset:0;background-image:radial-gradient(#d3dae8 1.2px,transparent 1.3px);background-size:32px 32px;opacity:.55;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 0%,transparent 75%)}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;transform-origin:960px 500px}
.abs{position:absolute}
.ib{display:inline-block}
.title{position:absolute;left:0;width:1920px;text-align:center}
.serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-1.5px;color:#0B1220;line-height:1}
.it{font-style:italic}
.blue{color:#2F6BFF}
.mut{color:#7A8599}
.card{position:absolute;background:#fff;border:1px solid #E5E9F2;border-radius:30px;
  box-shadow:0 40px 80px -30px rgba(20,40,100,.22),0 10px 24px -10px rgba(20,40,100,.12)}
.phone{position:absolute;border-radius:34px;overflow:hidden;border:6px solid #fff;background:#dfe5ef;
  box-shadow:0 40px 80px -28px rgba(20,40,100,.35),0 12px 26px -10px rgba(20,40,100,.18)}
.phone img,.phone canvas,.tile img{width:100%;height:100%;object-fit:cover;display:block}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:#fff;border:1px solid #E5E9F2;
  font:600 24px Inter;color:#0B1220;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(20,40,100,.25)}
.pill.b{background:#2F6BFF;border-color:#2F6BFF;color:#fff;box-shadow:0 16px 34px -12px rgba(47,107,255,.55)}
.pill.sm{font-size:19px;padding:9px 16px;gap:8px}
.row{position:absolute;display:flex;justify-content:center}
.ico{display:flex;align-items:center;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:#2F6BFF;box-shadow:0 0 0 6px rgba(47,107,255,.18)}
.cursor{position:absolute;left:0;top:0;width:40px;height:48px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));z-index:50}
.cursor svg{transform-origin:0 0}
svg.lines{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
#cap{position:absolute;left:0;top:948px;width:1920px;text-align:center;font:600 40px Inter;letter-spacing:-.3px}
#cap span{display:inline-block;margin:0 6px;text-shadow:0 0 18px #F4F6FA,0 0 4px #F4F6FA}
/* ad library */
.win{position:absolute;background:#fff;border-radius:26px;border:1px solid #E3E6EC;overflow:hidden;
  box-shadow:0 50px 100px -40px rgba(20,40,100,.30),0 12px 30px -12px rgba(20,40,100,.15)}
.wbar{position:absolute;left:0;top:0;right:0;height:58px;background:#F3F4F6;border-bottom:1px solid #E5E7EB}
.wd{position:absolute;top:23px;width:13px;height:13px;border-radius:50%;background:#D1D5DB}
.chip{position:absolute;height:50px;border:1px solid #CED0D4;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 16px;font:600 19px Inter;color:#1C1E21;background:#fff}
.adc{position:absolute;top:244px;width:350px;height:566px;border:1px solid #DADDE1;border-radius:14px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.adc .in{padding:16px 18px 12px}
.adc .st{font:700 17px Inter;color:#1F9D55;display:flex;align-items:center;gap:8px}
.adc .st i{width:10px;height:10px;border-radius:50%;background:#1F9D55;display:block}
.adc .l{font:500 14.5px Inter;color:#65676B;margin-top:6px}
.adc .pl{display:flex;gap:6px;align-items:center;margin-top:6px;font:500 14.5px Inter;color:#65676B}
.adc .pl b{width:17px;height:17px;border-radius:50%;background:#D8DADF;display:block}
.adc .bt{margin-top:12px;height:38px;border-radius:8px;background:#E4E6EB;font:600 15.5px Inter;color:#1C1E21;display:flex;align-items:center;justify-content:center}
.adc .adv{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;border-top:1px solid #E4E6EB}
.adc .av{width:40px;height:40px;border-radius:50%}
.adc .nm{font:700 16px Inter;color:#1C1E21}
.adc .sp{font:500 13.5px Inter;color:#65676B}
.adc .tx{padding:0 18px 10px;font:400 15px Inter;color:#1C1E21}
.adc .im{flex:1;min-height:0;position:relative}
.adc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="dots"></div>
  <div id="scenes"></div>
  <div id="cap"></div>
</div>
<script src="seq.js"></script>
<script>
// ---------- helpers ----------
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const P=(t,a,d)=>cl((t-a)/d);
const eo=k=>1-Math.pow(1-k,3);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const bk=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
function S(e,o={}){if(!e)return;const{o:op=1,x=0,y=0,s=1,b=0,r=0}=o;
  e.style.opacity=op;e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${r}deg)`;
  e.style.filter=b>0.15?`blur(${b.toFixed(1)}px)`:'none';e.style.visibility=op<=0.002?'hidden':'visible';}
function pop(t,a,{d=.55,dy=26,dx=0,s0=.9,b0=12}={}){const k=P(t,a,d),e=eo(k);
  return{o:cl(k*2.2),x:(1-e)*dx,y:(1-e)*dy,s:s0+(1-s0)*bk(k),b:(1-e)*b0}}
function out(t,a,{d=.35,dy=-16,b1=16}={}){const k=P(t,a,d),e=eio(k);return{o:1-e,y:e*dy,b:e*b1,s:1-.04*e}}
function both(t,a,z,oa={},oz={}){const p=pop(t,a,oa);if(z==null||t<z)return p;const q=out(t,z,oz);
  return{o:p.o*q.o,x:p.x,y:p.y+q.y,s:p.s*q.s,b:p.b+q.b}}
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const I={
 check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
 spark:'<path d="M12 2.5l2.3 6.2 6.2 2.3-6.2 2.3L12 19.5l-2.3-6.2L3.5 11l6.2-2.3z"/>',
 search:'<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
 film:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
 pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',play:'<path d="M7 4.5v15l12.5-7.5z"/>',
 trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 chev:'<path d="m6 9 6 6 6-6"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 hd:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M7 9v6M7 12h3M10 9v6M14 9v6h1.5a3 3 0 0 0 0-6z"/>'
};
const ic=(n,sz=24,col='currentColor',sw=2.4,fill=false)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${fill?col:'none'}" stroke="${fill?'none':col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const CURSOR='<div class="cursor"><svg width="40" height="48" viewBox="-2 -2 32 46"><path d="M0 0 L0 34 L9 26 L15 40 L21 37 L15 24 L27 24 Z" fill="#0B1220" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>';
const AD=i=>`assets/ad${i}.png`;
const phone=(src,l,t,w,h,extra='',id='')=>`<div class="phone" ${id?`id="${id}"`:''} style="left:${l}px;top:${t}px;width:${w}px;height:${h}px">${src.startsWith('canvas')?`<canvas width="${w*1.5|0}" height="${h*1.5|0}" data-seq="${src.split(':')[1]}"></canvas>`:`<img src="${src}">`}${extra}</div>`;
function cursorAt(c,x,y,click=0){c.style.left=x+'px';c.style.top=y+'px';c.firstChild.style.transform=`scale(${1-.18*click})`}
function clickK(t,a){return t<a||t>a+.3?0:Math.sin(P(t,a,.3)*Math.PI)}
// image sequences (pre-extracted video frames)
const SEQ={};
function loadSeq(name,n){SEQ[name]=[];for(let i=1;i<=n;i++){const im=new Image();im.src=`seq/${name}/${String(i).padStart(4,'0')}.jpg`;SEQ[name].push(im)}}
for(const k in (window.SEQN||{}))loadSeq(k,SEQN[k]);
function drawSeq(cv,name,vt,speed=1){const arr=SEQ[name];if(!arr||!arr.length)return;let i=Math.floor(Math.max(0,vt)*30*speed);i=Math.min(arr.length-1,i);
  const im=arr[i];if(!im.complete||!im.naturalWidth)return;const c=cv.getContext('2d');const cw=cv.width,ch=cv.height,iw=im.naturalWidth,ih=im.naturalHeight;
  const s=Math.max(cw/iw,ch/ih);const w=iw*s,h=ih*s;c.drawImage(im,(cw-w)/2,(ch-h)/2,w,h)}
function drawLine(p,k){p.style.strokeDashoffset=(1-k).toFixed(4);p.style.opacity=k>0?1:0}

const root=document.getElementById('scenes');const scenes=[];
function scene(a,z,html,upd){root.insertAdjacentHTML('beforeend',`<div class="scene">${html}</div>`);const r=root.lastElementChild;
  const sc={a,z,root:r,q:s=>r.querySelector(s),qa:s=>[...r.querySelectorAll(s)],upd};scenes.push(sc);return sc}

// ================= S1  0 – 3.15  "criativos validados" =================
{
 const imgs=[0,1,2,4,5];let cards='';
 imgs.forEach((im,i)=>{const cx=960+(i-2)*300;cards+=`<div class="abs c1" style="left:${cx-125}px;top:${340+Math.abs(i-2)*26}px;width:250px;height:444px">
   ${phone(AD(im),0,0,250,444)}<div class="row" style="left:0;right:0;bottom:-26px"><div class="pill b sm bd">${ic('check',20,'#fff',3.2)}Validado</div></div></div>`});
 scene(0,3.15,`
  <div class="title" id="l1" style="top:92px;font:600 30px Inter;letter-spacing:4px;color:#7A8599">COMO CRIAR</div>
  <div class="title serif" style="top:134px;font-size:124px"><span class="ib" id="w1">criativos</span> <span class="ib it blue" id="w2">validados</span></div>
  ${cards}`,
 (t,sc)=>{
  S(sc.q('#l1'),pop(t,.9,{dy:14}));S(sc.q('#w1'),pop(t,1.75,{dy:40,b0:16}));S(sc.q('#w2'),pop(t,2.25,{dy:40,b0:16,s0:.8}));
  sc.qa('.c1').forEach((c,i)=>{const p=pop(t,.05+i*.11,{d:.85,dy:160,b0:20,s0:.86});p.y+=Math.sin(t*1.4+i*1.3)*6;p.r=(i-2)*3.5;S(c,p)});
  sc.qa('.bd').forEach((b,i)=>S(b,pop(t,2.3+i*.08,{d:.45,dy:12,s0:.5,b0:6})));
 });
}
// ================= S2  3.15 – 7.55  "o mesmo modelo que eu uso para vender e anunciar" =================
scene(3.15,7.55,`
 <div class="title serif" id="t" style="top:64px;font-size:80px">O mesmo modelo que eu <span class="it blue">uso</span></div>
 <svg class="lines"><path id="ln1" d="M712 470 H795" pathLength="1" stroke="#2F6BFF" stroke-width="3" stroke-dasharray="1" fill="none" stroke-linecap="round"/>
  <path id="ln2" d="M1125 470 H1208" pathLength="1" stroke="#2F6BFF" stroke-width="3" stroke-dasharray="1" fill="none" stroke-linecap="round"/></svg>
 ${phone(AD(2),795,200,330,586,`
   <div class="abs" style="left:0;right:0;top:0;height:74px;background:rgba(255,255,255,.94);display:flex;align-items:center;gap:12px;padding:0 16px">
     <div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7AA2FF,#2F6BFF)"></div>
     <div><div style="font:700 18px Inter">Tua Loja</div><div style="font:500 14px Inter;color:#7A8599">Patrocinado</div></div></div>
   <div class="abs" style="left:14px;right:14px;bottom:14px;height:54px;border-radius:14px;background:#2F6BFF;color:#fff;font:700 19px Inter;display:flex;align-items:center;justify-content:center">Comprar agora</div>`,'ph')}
 <div class="card" id="c1" style="left:290px;top:360px;width:420px;height:224px">
   <div class="abs" style="left:30px;top:28px;display:flex;align-items:center;gap:12px;font:600 24px Inter;color:#7A8599">
     <div class="ico" style="width:44px;height:44px;border-radius:14px;background:#EAF0FF">${ic('trend',24,'#2F6BFF',2.6)}</div>Vendas</div>
   <div class="abs serif" id="n1" style="left:30px;top:100px;font-size:100px">R$ 0</div></div>
 <div class="card" id="c2" style="left:1210px;top:360px;width:420px;height:224px">
   <div class="abs" style="left:30px;top:28px;display:flex;align-items:center;gap:14px;font:600 24px Inter;color:#7A8599">
     <div class="ico" style="width:44px;height:44px;border-radius:14px;background:#EAF0FF">${ic('eye',24,'#2F6BFF',2.4)}</div>Anúncio ativo<div class="dot" id="pd" style="margin-left:4px"></div></div>
   <div class="abs serif" style="left:30px;top:100px;font-size:100px"><span id="n2">0</span><span style="font-size:52px;color:#7A8599"> mi alcance</span></div></div>
 `,(t,sc)=>{
  S(sc.q('#t'),pop(t,3.3,{dy:30}));
  const ph=pop(t,3.4,{d:.8,dy:120,b0:18});ph.y+=Math.sin(t*1.3)*5;S(sc.q('#ph'),ph);
  S(sc.q('#c1'),pop(t,5.6,{dx:-60,dy:0}));S(sc.q('#c2'),pop(t,6.3,{dx:60,dy:0}));
  drawLine(sc.q('#ln1'),eo(P(t,5.55,.4)));drawLine(sc.q('#ln2'),eo(P(t,6.25,.4)));
  sc.q('#n1').textContent='R$ '+fmt(12480*eo(P(t,5.7,1.4)));
  sc.q('#n2').textContent=(2.4*eo(P(t,6.4,1.0))).toFixed(1).replace('.',',');
  const pk=(t*1.6)%1;sc.q('#pd').style.boxShadow=`0 0 0 ${(4+pk*10).toFixed(1)}px rgba(47,107,255,${(.35*(1-pk)).toFixed(3)})`;
 });
// ================= S3  7.55 – 12.7  prompt + IA =================
{
 const PROMPT='Recria este anúncio validado em vídeo, com o meu produto.';
 scene(7.55,12.7,`
 <div class="title serif" id="ta" style="top:58px;font-size:80px">Eu te <span class="it blue">mostro</span></div>
 <div class="title serif" id="tb" style="top:58px;font-size:80px">Aprende <span class="it blue">fazendo</span></div>
 <div class="card" id="pc" style="left:460px;top:180px;width:1000px;height:250px">
   <div class="abs" style="left:32px;top:26px;display:flex;align-items:center;gap:10px;font:600 22px Inter;color:#7A8599">${ic('spark',24,'#2F6BFF',0,true)}Novo criativo com IA</div>
   <div class="abs" style="left:32px;top:72px;width:936px;font:500 36px/1.3 Inter;color:#0B1220"><span id="ty"></span><span id="ca" style="display:inline-block;width:3px;height:38px;background:#2F6BFF;vertical-align:-6px;margin-left:2px"></span></div>
   <div class="abs" style="left:32px;bottom:24px;display:flex;align-items:center;gap:10px;background:#F4F6FA;border-radius:14px;padding:6px 14px 6px 6px;font:500 18px Inter;color:#7A8599">
     <img src="${AD(0)}" style="width:42px;height:42px;border-radius:9px;object-fit:cover">anuncio-validado.png</div>
   <div class="abs pill b" id="gb" style="right:28px;bottom:22px;height:58px;font-size:23px">${ic('spark',22,'#fff',0,true)}Gerar</div>
 </div>
 <svg class="lines">${[995,1225,1455].map((cx,i)=>`<path class="ln" d="M600 625 C 760 625, ${cx} 450, ${cx} 520" pathLength="1" stroke="#2F6BFF" stroke-width="3" stroke-dasharray="1" fill="none" stroke-linecap="round" opacity="0"/>`).join('')}</svg>
 <div class="abs ico" id="hub" style="left:470px;top:560px;width:130px;height:130px;border-radius:38px;background:linear-gradient(140deg,#5C8DFF,#2F6BFF);box-shadow:0 26px 50px -16px rgba(47,107,255,.6)">${ic('spark',64,'#fff',0,true)}</div>
 <div class="row" style="left:335px;width:400px;top:716px"><div class="pill" id="hl">Inteligência artificial</div></div>
 ${[3,4,5].map((im,i)=>phone(AD(im),900+i*230,520,190,338,`<div class="abs ico" style="right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:#2F6BFF">${ic('check',20,'#fff',3.2)}</div>`,'r'+i)).join('')}
 ${CURSOR}
 `,(t,sc)=>{
  S(sc.q('#ta'),both(t,7.7,8.95,{dy:24}));S(sc.q('#tb'),pop(t,9.06,{dy:24}));
  S(sc.q('#pc'),pop(t,7.65,{d:.7,dy:60}));
  const n=Math.round(PROMPT.length*P(t,8.1,2.3));sc.q('#ty').textContent=PROMPT.slice(0,n);
  sc.q('#ca').style.opacity=(t<10.4||Math.floor(t*2.5)%2)?1:0;
  const c=sc.q('.cursor');const mk=eio(P(t,9.95,.7));cursorAt(c,lerp(1620,1350,mk),lerp(840,382,mk),clickK(t,10.7));
  S(c,{o:cl(P(t,9.85,.2))*(1-P(t,11.6,.3))});
  const gk=clickK(t,10.72);S(sc.q('#gb'),{s:1-.08*gk});sc.q('#gb').style.boxShadow=`0 0 0 ${(gk*14).toFixed(1)}px rgba(47,107,255,${(.25*gk).toFixed(2)}),0 16px 34px -12px rgba(47,107,255,.55)`;
  S(sc.q('#hub'),pop(t,11.2,{s0:.5,dy:10}));S(sc.q('#hl'),pop(t,11.55,{dy:14}));
  sc.qa('.ln').forEach((p,i)=>drawLine(p,eo(P(t,11.35+i*.15,.45))));
  [0,1,2].forEach(i=>{const p=pop(t,11.55+i*.15,{dy:50,d:.6});p.y+=Math.sin(t*1.5+i)*4;S(sc.q('#r'+i),p)});
 });
}
// ================= S4  12.7 – 18.85  criativos que já funcionam -> tua operação =================
{
 let tiles='';const N=24;const app=[];
 for(let i=0;i<N;i++){const c=i%8,r=Math.floor(i/8);tiles+=`<div class="abs tl" style="left:${640+c*128}px;top:${240+r*215}px;width:112px;height:199px;border-radius:16px;overflow:hidden;box-shadow:0 14px 28px -14px rgba(20,40,100,.35);border:3px solid #fff"><img src="${AD(i%6)}" style="width:100%;height:100%;object-fit:cover"></div>`;
   app.push(i==0?13.68:i<3?13.95+i*.14:14.4+(i-3)*.034)}
 const rows=[['Criativo 01','3,4x',.82],['Criativo 02','2,8x',.64],['Criativo 03','4,1x',.91]];
 scene(12.7,18.85,`
 <div class="title serif" id="ta" style="top:70px;font-size:80px">Criativos que <span class="it blue">já funcionam</span></div>
 <div class="title serif" id="tb" style="top:70px;font-size:80px">Aplica na <span class="it blue">tua operação</span></div>
 <div class="card ico" id="nc" style="left:250px;top:420px;width:270px;height:270px"><div class="serif" id="num" style="font-size:180px;margin-top:10px">0</div></div>
 <div class="row" style="left:185px;width:400px;top:726px"><div class="pill b" id="p1">${ic('check',22,'#fff',3)}Já funcionam</div></div>
 <div class="row" style="left:185px;width:400px;top:800px"><div class="pill" id="p2">${ic('globe',22,'#2F6BFF',2.2)}Na internet</div></div>
 ${tiles}
 <div class="card" id="op" style="left:560px;top:220px;width:800px;height:620px">
   <div class="abs serif" style="left:40px;top:38px;font-size:62px">Tua operação</div>
